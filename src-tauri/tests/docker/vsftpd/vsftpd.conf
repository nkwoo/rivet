# 통합 테스트용: 평문 로그인과 AUTH TLS를 모두 허용
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21109
pasv_address=127.0.0.1
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
rsa_cert_file=/etc/vsftpd/cert.pem
rsa_private_key_file=/etc/vsftpd/key.pem
xferlog_enable=NO
# 점으로 시작하는 파일도 목록에 보이게 함 (악성 파일명 테스트용)
force_dot_files=YES
