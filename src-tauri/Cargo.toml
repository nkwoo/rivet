[package]
name = "rivet"
version = "0.1.0"
description = "Open-source SSH, SFTP/FTP and RDP client for macOS and Windows"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# 2.11.5 이하는 GHSA-w28w-mhc8-qvjv 등 보안 권고 대상
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
